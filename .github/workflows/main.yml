name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:

      - name: Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@v1.0
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

          USE_CUSTOM_USER: 'true'
          CUSTOM_USERNAME: ${{ secrets.CUSTOM_USERNAME }}
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
              $tailscale = "$env:ProgramFiles(x86)\Tailscale\tailscale.exe"
          }

          if (!(Test-Path $tailscale)) {
              Write-Error "Tailscale is not installed."
              exit 1
          }

          $ip = & $tailscale ip -4 | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Check RDP Port
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if ($result.TcpTestSucceeded) {
              Write-Host "RDP port 3389 is reachable."
          }
          else {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================"
          Write-Host "        RDP INFORMATION"
          Write-Host "================================"
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : $env:CUSTOM_USERNAME"
          Write-Host "Password : GitHub Secret CUSTOM_PASSWORD"
          Write-Host "================================"
